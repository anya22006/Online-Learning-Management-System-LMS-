<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/instructor.css">
    <link rel="stylesheet" href="css/settings.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS Student</div>
        </div>
        <nav class="nav-menu">
            <a href="student-dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard Overview</a>
            <a href="my-courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> My Courses</a>
            <a href="my-assignments.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Assignments</a>
            <a href="my-grades.html" class="nav-item"><i class="fa-solid fa-award"></i> My Grades</a>
            <a href="my-quizzes.html" class="nav-item"><i class="fa-solid fa-brain"></i> Quizzes</a>
            <a href="my-progress.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> My Progress</a>
            <a href="settings.html" class="nav-item active"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="#" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Student Profile Settings</h1>
            </div>
            <div class="user-badge"><i class="fa-solid fa-graduation-cap"></i> Logged in as Student</div>
        </header>

        <div class="content-body">
            <div class="card-section" style="max-width: 800px;">
                <div class="section-header">
                    <h2><i class="fa-solid fa-user-gear"></i> Account Profile</h2>
                </div>
                <p id="profile-message" class="message" role="status" aria-live="polite" hidden></p>

                <form id="profile-form" style="display: flex; flex-direction: column; gap: 20px; margin-top: 16px;">
                    <div class="form-group">
                        <label for="profile-name">Full Name</label>
                        <input id="profile-name" class="form-control" name="name" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="profile-email">Email Address</label>
                        <input id="profile-email" class="form-control" name="email" type="email" autocomplete="email" required>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px;">
                        <div style="padding: 16px; background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border-color); border-radius: 8px;">
                            <span style="font-size: 0.85rem; color: var(--text-muted);">Role</span>
                            <div id="profile-role" style="font-size: 1.1rem; font-weight: 700; color: var(--accent-indigo); margin-top: 4px;">Loading…</div>
                        </div>
                        <div style="padding: 16px; background: rgba(30, 41, 59, 0.5); border: 1px solid var(--border-color); border-radius: 8px;">
                            <span style="font-size: 0.85rem; color: var(--text-muted);">Account Status</span>
                            <div id="profile-status" style="font-size: 1.1rem; font-weight: 700; color: var(--accent-emerald); margin-top: 4px;">Loading…</div>
                        </div>
                    </div>

                    <div style="margin-top: 10px;">
                        <button id="save-profile" class="btn btn-primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Save Profile Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/settings.js"></script>
</body>
</html>
