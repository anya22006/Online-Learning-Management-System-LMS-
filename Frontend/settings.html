<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/settings.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <h2>LMS</h2>
            </div>
            <nav aria-label="Student navigation">
                <a href="student-dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="my-courses.html"><i class="fa-solid fa-book"></i> My Courses</a>
                <a href="course-catalog.html"><i class="fa-solid fa-magnifying-glass"></i> Browse Courses</a>
                <a href="my-assignments.html"><i class="fa-solid fa-file-pen"></i> Assignments</a>
                <a href="my-grades.html"><i class="fa-solid fa-chart-column"></i> Grades</a>
                <a href="my-quizzes.html"><i class="fa-solid fa-brain"></i> Quizzes</a>
                <a href="my-progress.html"><i class="fa-solid fa-chart-line"></i> My Progress</a>
                <a class="active" href="settings.html" aria-current="page"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="#" class="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-heading">
                <div>
                    <p class="eyebrow">YOUR ACCOUNT</p>
                    <h1>Settings</h1>
                    <p class="intro">View and update your student profile information.</p>
                </div>
            </header>

            <section class="profile-card" aria-labelledby="profile-heading">
                <h2 id="profile-heading">Profile</h2>
                <p class="card-intro">Your profile details are saved to your LMS account.</p>
                <p id="profile-message" class="message" role="status" aria-live="polite" hidden></p>

                <form id="profile-form">
                    <label for="profile-name">Name</label>
                    <input id="profile-name" name="name" type="text" autocomplete="name" required>

                    <label for="profile-email">Email</label>
                    <input id="profile-email" name="email" type="email" autocomplete="email" required>

                    <div class="account-details" aria-label="Read-only account information">
                        <div>
                            <span>Role</span>
                            <strong id="profile-role">Loading…</strong>
                        </div>
                        <div>
                            <span>Status</span>
                            <strong id="profile-status">Loading…</strong>
                        </div>
                    </div>

                    <button id="save-profile" class="primary-button" type="submit">Save Changes</button>
                </form>
            </section>
        </main>
    </div>
    <script src="js/settings.js"></script>
</body>
</html>
