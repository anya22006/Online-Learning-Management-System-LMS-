<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Course Details | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"
          href="css/course-details.css">

</head>


<body>

    <div class="dashboard">


        <!-- =================================
             SIDEBAR
        ================================== -->

        <aside class="sidebar">

            <div class="logo">
                <h2>LMS</h2>
            </div>


            <nav>

                <a href="student-dashboard.html">
                    Dashboard
                </a>

                <a href="my-courses.html">
                    My Courses
                </a>

                <a href="course-catalog.html">
                    Browse Courses
                </a>

                <a href="my-assignments.html">
                    Assignments
                </a>

                <a href="my-grades.html">
                    Grades
                </a>

                <a href="my-quizzes.html">
                    Quizzes
                </a>

                <a href="my-progress.html">
                    My Progress
                </a>

                <a href="settings.html">
                    Settings
                </a>

                <a href="#"
                   class="logout">
                    Logout
                </a>

            </nav>

        </aside>



        <!-- =================================
             MAIN CONTENT
        ================================== -->

        <main class="main-content">


            <!-- TOP BAR -->

            <div class="topbar">

                <button
                    class="back-button"
                    onclick="goBackToCourses()">

                    ← Back to My Courses

                </button>

            </div>



            <!-- COURSE HEADER -->

            <section
                id="course-header"
                class="course-header">

                <div>

                    <span class="course-label">
                        COURSE
                    </span>

                    <h1 id="course-title">
                        Loading course...
                    </h1>

                    <p id="course-description">
                        Loading course information...
                    </p>

                </div>

            </section>



            <!-- COURSE CONTENT -->

            <section class="content-section">

                <div class="section-title">

                    <h2>
                        Course Content
                    </h2>

                    <p>
                        Modules and lessons
                    </p>

                </div>


                <!-- MODULES WILL APPEAR HERE -->

                <div
                    id="module-list"
                    class="module-list">

                    <p class="loading">
                        Loading modules...
                    </p>

                </div>

            </section>


        </main>

    </div>


    <script src="js/student.js"></script>

</body>

</html>
