<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grades | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/my-grades.css">
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar">
            <div class="logo">
                <h2>LMS</h2>
            </div>
            <nav aria-label="Student navigation">
                <a href="student-dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a>
                <a href="my-courses.html"><i class="fa-solid fa-book"></i> My Courses</a>
                <a href="course-catalog.html"><i class="fa-solid fa-magnifying-glass"></i> Browse Courses</a>
                <a href="my-assignments.html"><i class="fa-solid fa-file-pen"></i> Assignments</a>
                <a class="active" href="my-grades.html" aria-current="page"><i class="fa-solid fa-chart-column"></i> Grades</a>
                <a href="my-quizzes.html"><i class="fa-solid fa-brain"></i> Quizzes</a>
                <a href="my-progress.html"><i class="fa-solid fa-chart-line"></i> My Progress</a>
                <a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-heading">
                <div>
                    <p class="eyebrow">YOUR RESULTS</p>
                    <h1>My Grades</h1>
                    <p class="intro">Review marks, instructor feedback, and the status of your submitted assignments.</p>
                </div>
                <a class="back-link" href="my-assignments.html">← Assignments</a>
            </header>

            <section class="summary-grid" aria-label="Grade summary">
                <article class="summary-card">
                    <p>Total graded assignments</p>
                    <strong id="graded-count">—</strong>
                </article>
                <article class="summary-card">
                    <p>Average marks</p>
                    <strong id="average-marks">—</strong>
                </article>
            </section>

            <p id="grade-notice" class="grade-notice" role="status" hidden></p>

            <section id="grade-list" class="grade-list" aria-live="polite">
                <p class="state-message">Loading your grades…</p>
            </section>
        </main>
    </div>

    <script src="js/grades.js"></script>
</body>
</html>
