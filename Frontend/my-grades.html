<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Grades | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/instructor.css">
    <link rel="stylesheet" href="css/my-grades.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS Student</div>
        </div>
        <nav class="nav-menu">
            <a href="student-dashboard.html" class="nav-item"><i class="fa-solid fa-house"></i> Dashboard Overview</a>
            <a href="my-courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> My Courses</a>
            <a href="my-assignments.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Assignments</a>
            <a href="my-grades.html" class="nav-item active"><i class="fa-solid fa-award"></i> My Grades</a>
            <a href="my-quizzes.html" class="nav-item"><i class="fa-solid fa-brain"></i> Quizzes</a>
            <a href="my-progress.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> My Progress</a>
            <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            <a href="#" class="nav-item logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
        </nav>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Grades & Assessment Results</h1>
            </div>
            <div class="user-badge"><i class="fa-solid fa-graduation-cap"></i> Logged in as Student</div>
        </header>

        <div class="content-body" style="display: flex; flex-direction: column; gap: 24px;">
            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>Graded Submissions</h3>
                    <div class="value" id="graded-count" style="color: var(--accent-emerald);">—</div>
                </div>
                <div class="metric-card">
                    <h3>Average Marks</h3>
                    <div class="value" id="average-marks" style="color: var(--accent-indigo);">—</div>
                </div>
            </div>

            <div class="card-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-award"></i> Graded Assignments & Instructor Feedback</h2>
                </div>

                <div id="grade-list" class="grade-list" style="display: flex; flex-direction: column; gap: 16px; margin-top: 16px;">
                    <p class="state-message" style="color: var(--text-muted);">Loading your grades…</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script src="js/grades.js"></script>
</body>
</html>
