<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LMS Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #090d16;
            --bg-surface: #111827;
            --bg-elevated: #1e293b;
            --border: #334155;
            --border-glow: rgba(99, 102, 241, 0.4);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient background glow */
        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            filter: blur(80px);
            z-index: 0;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            bottom: -100px;
            right: -100px;
            filter: blur(80px);
            z-index: 0;
        }

        .auth-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.1);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #3b82f6);
            color: #fff;
            font-size: 24px;
            margin-bottom: 14px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.5);
        }

        .brand-header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Demo Quick Login buttons */
        .demo-bar {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 24px;
        }

        .demo-bar-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .demo-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .demo-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .demo-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-1px);
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: #fff;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-control {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px 12px 42px;
            color: #fff;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
            background: #243046;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #fff;
            border: none;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4f46e5, #4338ca);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-error {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .db-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="auth-container">
        <div class="brand-header">
            <div class="logo-badge"><i class="fa-solid fa-graduation-cap"></i></div>
            <h1>Universal LMS Portal</h1>
            <p>Single login for Students, Instructors & Administrators</p>
        </div>

        <!-- Quick Fill Demo Login -->
        <div class="demo-bar">
            <div class="demo-bar-title">
                <span><i class="fa-solid fa-bolt" style="color: var(--amber);"></i> Quick Demo Login</span>
                <span class="db-badge"><i class="fa-solid fa-database"></i> SQLite Active</span>
            </div>
            <div class="demo-buttons">
                <button type="button" class="demo-btn" onclick="quickFill('student@lms.com', 'student123')">
                    <i class="fa-solid fa-user-graduate"></i> Student (Alex)
                </button>
                <button type="button" class="demo-btn" onclick="quickFill('emily@lms.com', 'student123')">
                    <i class="fa-solid fa-user-graduate"></i> Student (Emily)
                </button>
                <button type="button" class="demo-btn" onclick="quickFill('instructor@lms.com', 'instructor123')">
                    <i class="fa-solid fa-chalkboard-user"></i> Instructor
                </button>
                <button type="button" class="demo-btn" onclick="quickFill('admin@lms.com', 'admin123')">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </button>
            </div>
        </div>

        <!-- Alerts -->
        <div th:if="${error}" class="alert-box alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">Invalid credentials</span>
        </div>
        <div th:if="${registerError}" class="alert-box alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${registerError}">Registration error</span>
        </div>
        <div th:if="${logoutMessage}" class="alert-box alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${logoutMessage}">Logged out</span>
        </div>

        <!-- Tabs -->
        <div class="auth-tabs">
            <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchTab('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
            <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchTab('register')">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
        </div>

        <!-- Login Form -->
        <div class="form-panel active" id="loginPanel">
            <form th:action="@{/login}" method="POST">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="loginEmail" name="email" class="input-control" placeholder="name@domain.com" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" name="password" class="input-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Enter Application</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>

        <!-- Registration Form -->
        <div class="form-panel" id="registerPanel">
            <form th:action="@{/register}" method="POST">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="regName" name="fullName" class="input-control" placeholder="e.g. John Doe" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="regEmail" name="email" class="input-control" placeholder="john@domain.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPassword" name="password" class="input-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regRole">Select Role</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-badge"></i>
                        <select id="regRole" name="role" class="input-control" style="cursor: pointer;">
                            <option value="STUDENT">Student (Enroll in courses & take quizzes)</option>
                            <option value="INSTRUCTOR">Instructor (Create courses & grade assignments)</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regDepartment">Department / Field</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-building-columns"></i>
                        <input type="text" id="regDepartment" name="department" class="input-control" placeholder="e.g. Computer Science">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <span>Create Account & Log In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function quickFill(email, password) {
            switchTab('login');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
        }

        function switchTab(tab) {
            const loginPanel = document.getElementById('loginPanel');
            const registerPanel = document.getElementById('registerPanel');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginPanel.classList.add('active');
                registerPanel.classList.remove('active');
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginPanel.classList.remove('active');
                registerPanel.classList.add('active');
                tabLoginBtn.classList.remove('active');
                tabRegisterBtn.classList.add('active');
            }
        }

        // Auto switch tab if URL parameter ?tab=register
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'register') {
            switchTab('register');
        }
    </script>
</body>
</html>
