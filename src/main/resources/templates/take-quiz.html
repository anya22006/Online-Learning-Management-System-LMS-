<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${quiz.title} + ' | LMS Quiz')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('quizzes', 'STUDENT')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header(${quiz.title}, 'Complete all questions for instant grading', ${currentUser}, 'Student')}"></header>

        <div class="content-body" style="max-width: 860px;">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div style="background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 12px; padding: 18px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h3 style="font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 6px;"><i class="fa-solid fa-circle-info"></i> Instructions</h3>
                    <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 0;" th:text="${quiz.instructions}">Read all questions carefully and select the best answer.</p>
                </div>
                <div style="display: flex; gap: 14px;">
                    <span style="font-size: 13px; color: var(--accent-amber); font-weight: 600;">
                        <i class="fa-regular fa-clock"></i> <span th:text="${quiz.timeLimitMinutes}">20</span> Mins
                    </span>
                    <span style="font-size: 13px; color: var(--accent-emerald); font-weight: 600;">
                        <i class="fa-solid fa-trophy"></i> <span th:text="${quiz.totalMarks}">100</span> Pts
                    </span>
                </div>
            </div>

            <form th:action="@{/student/submit-quiz}" method="POST">
                <input type="hidden" name="quizId" th:value="${quiz.quizId}">

                <div th:each="q, stat : ${questions}" style="background: #111827; border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;">
                        <span style="font-size: 12px; font-weight: 700; color: #818cf8; background: rgba(99, 102, 241, 0.15); padding: 4px 10px; border-radius: 6px;">
                            Question <span th:text="${stat.index + 1}">1</span> of <span th:text="${#lists.size(questions)}">4</span>
                        </span>
                        <span style="font-size: 12px; color: var(--text-muted);" th:text="${q.marks} + ' Points'">25 Points</span>
                    </div>

                    <h4 style="font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 16px; line-height: 1.5;" th:text="${q.questionText}">Question text</h4>

                    <div class="options-list">
                        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer;">
                            <input type="radio" th:name="'q_' + ${q.questionId}" value="A" required style="accent-color: #6366f1;">
                            <span><strong>A.</strong> <span th:text="${q.optionA}">Option A</span></span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer;">
                            <input type="radio" th:name="'q_' + ${q.questionId}" value="B" style="accent-color: #6366f1;">
                            <span><strong>B.</strong> <span th:text="${q.optionB}">Option B</span></span>
                        </label>
                        <label th:if="${q.optionC != null && !q.optionC.isEmpty()}" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer;">
                            <input type="radio" th:name="'q_' + ${q.questionId}" value="C" style="accent-color: #6366f1;">
                            <span><strong>C.</strong> <span th:text="${q.optionC}">Option C</span></span>
                        </label>
                        <label th:if="${q.optionD != null && !q.optionD.isEmpty()}" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer;">
                            <input type="radio" th:name="'q_' + ${q.questionId}" value="D" style="accent-color: #6366f1;">
                            <span><strong>D.</strong> <span th:text="${q.optionD}">Option D</span></span>
                        </label>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 14px; margin-top: 24px; padding-bottom: 40px;">
                    <a th:href="@{/student/my-quizzes}" class="btn btn-secondary" style="padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: 600;">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="padding: 12px 32px; border-radius: 8px; font-weight: 700; font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-check"></i> Submit Quiz & View Grade
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
