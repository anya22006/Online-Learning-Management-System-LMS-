<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Instructor Dashboard | LMS Platform')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('dashboard', ${currentUser != null ? currentUser.role : 'INSTRUCTOR'})}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header('Instructor Dashboard', 'Welcome back, ' + (${currentUser != null} ? ${currentUser.fullName} : 'Instructor'), ${currentUser}, 'Instructor')}"></header>

        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>Total Courses</h3>
                    <div class="value" th:text="${totalCourses}">0</div>
                </div>
                <div class="metric-card">
                    <h3>Published Courses</h3>
                    <div class="value" style="color: var(--accent-emerald);" th:text="${publishedCourses}">0</div>
                </div>
                <div class="metric-card">
                    <h3>Submissions to Review</h3>
                    <div class="value" style="color: var(--accent-amber);" th:text="${pendingSubmissions}">0</div>
                </div>
            </div>

            <div class="card-section" style="margin-top: 24px;">
                <div class="section-header">
                    <h2><i class="fa-solid fa-book-bookmark"></i> My Managed Courses</h2>
                    <div style="display: flex; gap: 10px;">
                        <a th:href="@{/instructor/create-course}" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Course</a>
                        <a th:href="@{/instructor/create-assignment}" class="btn btn-secondary"><i class="fa-solid fa-plus"></i> New Quiz / Assignment</a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(courses)}" style="padding: 40px; text-align: center; color: var(--text-muted);">
                    You haven't created any courses yet.
                    <div style="margin-top: 12px;">
                        <a th:href="@{/instructor/create-course}" class="btn btn-primary btn-sm">Create First Course</a>
                    </div>
                </div>

                <table th:unless="${#lists.isEmpty(courses)}" class="custom-table">
                    <thead>
                        <tr>
                            <th>Course ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${courses}">
                            <td><strong style="color: #6366f1;">#<span th:text="${course.courseId}">1</span></strong></td>
                            <td th:text="${course.title}">Course Title</td>
                            <td th:text="${course.category}">Web Dev</td>
                            <td>
                                <span class="badge" th:classappend="${course.status.name() == 'PUBLISHED' ? 'badge-success' : 'badge-warning'}" th:text="${course.status}">Status</span>
                            </td>
                            <td>
                                <a th:href="@{/instructor/manage-courses}" class="btn btn-secondary btn-sm">
                                    <i class="fa-solid fa-gear"></i> Manage
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
