<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create Course | LMS Instructor')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('create-course', ${currentUser != null ? currentUser.role : 'INSTRUCTOR'})}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header('Create New Course', 'Add a new course curriculum stored directly in SQLite', ${currentUser}, 'Instructor')}"></header>

        <div class="content-body" style="max-width: 800px;">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card-section">
                <form th:action="@{/instructor/create-course}" method="POST">
                    <div class="form-group" style="margin-bottom: 18px;">
                        <label style="font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px;">Course Title</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Master Spring Boot & SQLite Full-Stack" required style="width: 100%; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #fff; font-size: 14px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 18px;">
                        <label style="font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px;">Category</label>
                        <select name="category" class="form-control" required style="width: 100%; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #fff; font-size: 14px; cursor: pointer;">
                            <option value="Computer Science">Computer Science</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Databases & SQL">Databases & SQL</option>
                            <option value="Cloud Architecture">Cloud Architecture</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 18px;">
                        <label style="font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px;">Course Description</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Comprehensive summary of what students will master..." required style="width: 100%; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #fff; font-size: 13px;"></textarea>
                    </div>

                    <div class="form-group" style="margin-bottom: 20px;">
                        <label style="font-size: 13px; font-weight: 600; color: #cbd5e1; display: block; margin-bottom: 6px;">Course Syllabus & Modules</label>
                        <textarea name="syllabus" class="form-control" rows="5" placeholder="Module 1: Introduction&#10;Module 2: Core Concepts&#10;Module 3: Project Setup" style="width: 100%; background: #090d16; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: #fff; font-size: 13px;"></textarea>
                    </div>

                    <div class="form-group" style="margin-bottom: 24px; display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="publishNow" name="publishNow" value="true" checked style="width: 18px; height: 18px; accent-color: #6366f1;">
                        <label for="publishNow" style="font-size: 14px; color: #cbd5e1; cursor: pointer;">Publish immediately (visible to all students in Course Catalog)</label>
                    </div>

                    <button type="submit" class="btn btn-primary" style="padding: 12px 28px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save Course to SQLite
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
