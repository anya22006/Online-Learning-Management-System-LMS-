<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quizzes | LMS Platform')}"></head>
<body>
    <aside th:replace="~{fragments/layout :: sidebar('quizzes', 'STUDENT')}"></aside>

    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header('Interactive Quizzes', 'Test your knowledge with automated SQLite grading', ${currentUser}, 'Student')}"></header>

        <div class="content-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div th:if="${quizResult}" class="alert-toast">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${quizResult}">Result</span>
            </div>

            <div class="card-section" style="margin-bottom: 24px;">
                <div class="section-header">
                    <h2><i class="fa-solid fa-list-ol"></i> Available Quizzes</h2>
                </div>

                <div th:if="${#lists.isEmpty(quizzes)}" style="padding: 30px; text-align: center; color: var(--text-muted);">
                    No quizzes found.
                </div>

                <div th:each="q : ${quizzes}" style="background: #111827; border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 style="font-size: 17px; font-weight: 700; color: #fff; margin-bottom: 6px;" th:text="${q.title}">Quiz Title</h3>
                        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;" th:text="${q.instructions}">Instructions</p>
                        <div style="display: flex; gap: 14px; font-size: 12px; color: #94a3b8;">
                            <span><i class="fa-regular fa-clock"></i> <span th:text="${q.timeLimitMinutes}">20</span> mins</span>
                            <span><i class="fa-solid fa-trophy"></i> <span th:text="${q.totalMarks}">100</span> pts</span>
                        </div>
                    </div>
                    <div>
                        <a th:href="@{'/student/take-quiz/' + ${q.quizId}}" class="btn btn-primary" style="padding: 10px 20px; border-radius: 8px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-pen"></i> Take Quiz Now
                        </a>
                    </div>
                </div>
            </div>

            <!-- Previous Attempts -->
            <div class="card-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-clock-rotate-left"></i> My Quiz Attempts & Scores (SQLite)</h2>
                </div>

                <div th:if="${#lists.isEmpty(attempts)}" style="padding: 30px; text-align: center; color: var(--text-muted); font-size: 14px;">
                    No attempts recorded yet. Take a quiz above to record your score!
                </div>

                <table th:unless="${#lists.isEmpty(attempts)}" class="custom-table">
                    <thead>
                        <tr>
                            <th>Quiz ID</th>
                            <th>Score</th>
                            <th>Total Marks</th>
                            <th>Percentage</th>
                            <th>Submitted Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="qa : ${attempts}">
                            <td><strong style="color: #6366f1;">Quiz #<span th:text="${qa.quizId}">1</span></strong></td>
                            <td th:text="${qa.score}">100</td>
                            <td th:text="${qa.totalMarks}">100</td>
                            <td>
                                <span style="font-weight: 700; color: #10b981;" th:text="${qa.percentage} + '%'">100%</span>
                            </td>
                            <td style="color: var(--text-muted); font-size: 12px;" th:text="${qa.submittedAt}">Date</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
