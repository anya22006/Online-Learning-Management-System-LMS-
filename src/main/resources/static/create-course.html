<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Course | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="css/instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS</div>
        </div>
        <nav class="nav-menu">
            <a href="instructor-dashboard.html" class="nav-item">📊 Dashboard Overview</a>
            <a href="manage-courses.html" class="nav-item">📚 Manage Courses</a>
            <a href="create-course.html" class="nav-item active">➕ Create Course</a>
            <a href="create-assignment.html" class="nav-item">📝 Create Quiz & Assignment</a>
            <a href="grade-submissions.html" class="nav-item">⭐ Grade Submissions</a>
            <a href="settings.html" class="nav-item">⚙️ Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Create New Course</h1>
            </div>
            <div class="user-badge">👨‍🏫 Logged in as Instructor</div>
        </header>

        <div class="content-body">
            <div class="card-section" style="max-width: 800px;">
                <div class="section-header">
                    <h2>Course Details</h2>
                </div>
                <form id="createCourseForm">
                    <div class="form-group">
                        <label for="title">Course Title</label>
                        <input type="text" id="title" class="form-control" placeholder="e.g. Master Java Spring Boot & Microservices" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" class="form-control" placeholder="e.g. Web Development, Computer Science, Data Science" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Course Description</label>
                        <textarea id="description" class="form-control" placeholder="Provide a comprehensive summary of what students will learn..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="syllabus">Syllabus / Modules Overview</label>
                        <textarea id="syllabus" class="form-control" placeholder="Module 1: Introduction&#10;Module 2: REST API Design&#10;Module 3: Database & Security"></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary" style="padding: 12px 24px;">Save Draft Course</button>
                        <a href="manage-courses.html" class="btn btn-secondary" style="padding: 12px 24px;">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/instructor.js"></script>
</body>
</html>
