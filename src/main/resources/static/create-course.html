<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Course | LMS Instructor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS</div>
        </div>
        <nav class="nav-menu">
            <a href="instructor-dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard Overview</a>
            <a href="manage-courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Manage Courses</a>
            <a href="create-course.html" class="nav-item active"><i class="fa-solid fa-folder-plus"></i> Create Course</a>
            <a href="create-assignment.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Create Quiz & Assignment</a>
            <a href="grade-submissions.html" class="nav-item"><i class="fa-solid fa-award"></i> Grade Submissions</a>
            <a href="instructor-settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Create New Course</h1>
            </div>
            <div class="user-badge"><i class="fa-solid fa-user-tie"></i> Logged in as Instructor (ID: 2)</div>
        </header>

        <div class="content-body">
            <div class="card-section" style="max-width: 800px;">
                <div class="section-header">
                    <h2>Course Details</h2>
                </div>
                <form id="createCourseForm">
                    <div class="form-group">
                        <label for="courseTitle">Course Title</label>
                        <input type="text" id="courseTitle" class="form-control" placeholder="e.g. Advanced Java Microservices" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" class="form-control" required>
                            <option value="">Select Category</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Web Development">Web Development</option>
                            <option value="Data Science">Data Science</option>
                            <option value="Mobile Development">Mobile Development</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Course Description</label>
                        <textarea id="description" class="form-control" rows="4" placeholder="Brief outline of course objectives..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="syllabus">Course Syllabus / Modules</label>
                        <textarea id="syllabus" class="form-control" rows="5" placeholder="Module 1: Introduction&#10;Module 2: Core Concepts&#10;Module 3: Project Work" required></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 24px;">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save & Publish Course</button>
                        <a href="manage-courses.html" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/instructor.js"></script>
</body>
</html>
