<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS</div>
        </div>
        <nav class="nav-menu">
            <a href="instructor-dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard Overview</a>
            <a href="manage-courses.html" class="nav-item active"><i class="fa-solid fa-book-open"></i> Manage Courses</a>
            <a href="create-course.html" class="nav-item"><i class="fa-solid fa-folder-plus"></i> Create Course</a>
            <a href="create-assignment.html" class="nav-item"><i class="fa-solid fa-pen-to-square"></i> Create Quiz & Assignment</a>
            <a href="grade-submissions.html" class="nav-item"><i class="fa-solid fa-award"></i> Grade Submissions</a>

    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Manage Courses</h1>
            </div>
            <div class="user-badge"><i class="fa-solid fa-user-tie"></i> Logged in as Instructor (ID: 2)</div>

        <div class="content-body">
            <div class="card-section">
                <div class="section-header">
                    <h2>All Created Courses</h2>
                    <a href="create-course.html" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Create New Course</a>
                </div>

                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Syllabus</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="manageCourseTableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/instructor.js"></script>
