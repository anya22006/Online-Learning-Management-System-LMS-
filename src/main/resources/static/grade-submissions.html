<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Submissions | LMS</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="css/instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS</div>
        </div>
        <nav class="nav-menu">
            <a href="instructor-dashboard.html" class="nav-item">📊 Dashboard Overview</a>
            <a href="manage-courses.html" class="nav-item">📚 Manage Courses</a>
            <a href="create-course.html" class="nav-item">➕ Create Course</a>
            <a href="create-assignment.html" class="nav-item">📝 Create Quiz & Assignment</a>
            <a href="grade-submissions.html" class="nav-item active">⭐ Grade Submissions</a>
            <a href="instructor-settings.html" class="nav-item">⚙️ Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Grade Submissions</h1>
            </div>
            <div class="user-badge">👨‍🏫 Logged in as Instructor</div>
        </header>

        <div class="content-body">
            <!-- Student Submissions Table -->
            <div class="card-section">
                <div class="section-header">
                    <h2>Student Submissions</h2>
                </div>
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Submission ID</th>
                            <th>Student Name</th>
                            <th>Submission Content</th>
                            <th>Submitted Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="submissionTableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>

            <!-- Grade Form Section (Initially Hidden) -->
            <div class="card-section" id="gradeSection" style="display: none; max-width: 700px; border-color: var(--accent-blue);">
                <div class="section-header">
                    <h2>Evaluate Submission for: <span id="modalStudentName" style="color: var(--accent-blue);">Student</span></h2>
                </div>
                <form id="gradeForm">
                    <input type="hidden" id="modalSubmissionId">

                    <div class="form-group">
                        <label for="score">Marks Awarded</label>
                        <input type="number" id="score" class="form-control" placeholder="e.g. 85" min="0" max="100" required>
                    </div>

                    <div class="form-group">
                        <label for="maxScore">Maximum Marks</label>
                        <input type="number" id="maxScore" class="form-control" value="100" required readonly>
                    </div>

                    <div class="form-group">
                        <label for="feedback">Instructor Feedback & Comments</label>
                        <textarea id="feedback" class="form-control" placeholder="Provide construct feedback or suggestions for improvement..." required></textarea>
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 16px;">
                        <button type="submit" class="btn btn-success" style="padding: 12px 24px;">Submit Grade & Feedback</button>
                        <button type="button" class="btn btn-secondary" onclick="document.getElementById('gradeSection').style.display='none'">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/instructor.js"></script>
</body>
</html>
