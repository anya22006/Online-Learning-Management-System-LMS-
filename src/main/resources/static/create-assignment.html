<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz & Assignment | LMS Instructor</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text y='.9em' font-size='70' font-weight='bold' fill='white' x='25'>L</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/instructor.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-icon">L</div>
            <div class="brand-text">LMS</div>
        </div>
        <nav class="nav-menu">
            <a href="instructor-dashboard.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Dashboard Overview</a>
            <a href="manage-courses.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Manage Courses</a>
            <a href="create-course.html" class="nav-item"><i class="fa-solid fa-folder-plus"></i> Create Course</a>
            <a href="create-assignment.html" class="nav-item active"><i class="fa-solid fa-pen-to-square"></i> Create Quiz & Assignment</a>
            <a href="grade-submissions.html" class="nav-item"><i class="fa-solid fa-award"></i> Grade Submissions</a>
            <a href="instructor-settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="header">
            <div class="header-title">
                <h1>Create Quiz & Assignment</h1>
            </div>
            <div class="user-badge"><i class="fa-solid fa-user-tie"></i> Logged in as Instructor (ID: 2)</div>
        </header>

        <div class="content-body" style="display: flex; flex-direction: column; gap: 32px;">
            <!-- Assignment Section -->
            <div class="card-section" style="max-width: 800px;">
                <div class="section-header">
                    <h2><i class="fa-solid fa-file-signature"></i> Create New Assignment</h2>
                </div>
                <form id="createAssignmentForm">
                    <div class="form-group">
                        <label for="assignmentCourseId">Target Course</label>
                        <select id="assignmentCourseId" class="form-control" required>
                            <option value="">Select Course...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="assignmentTitle">Assignment Title</label>
                        <input type="text" id="assignmentTitle" class="form-control" placeholder="e.g. Build REST API for E-Commerce" required>
                    </div>

                    <div class="form-group">
                        <label for="instructions">Instructions / Problem Statement</label>
                        <textarea id="instructions" class="form-control" rows="4" placeholder="Detailed requirements for the assignment..." required></textarea>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label for="dueDate">Due Date & Time</label>
                            <input type="datetime-local" id="dueDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="maxScore">Maximum Marks</label>
                            <input type="number" id="maxScore" class="form-control" value="100" min="1" required>
                        </div>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Publish Assignment</button>
                    </div>
                </form>
            </div>

            <!-- Quiz Section -->
            <div class="card-section" style="max-width: 800px;">
                <div class="section-header">
                    <h2><i class="fa-solid fa-brain"></i> Create New Quiz</h2>
                </div>
                <form id="createQuizForm">
                    <div class="form-group">
                        <label for="quizCourseId">Target Course</label>
                        <select id="quizCourseId" class="form-control" required>
                            <option value="">Select Course...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quizTitle">Quiz Title</label>
                        <input type="text" id="quizTitle" class="form-control" placeholder="e.g. Java Collections Framework Quiz" required>
                    </div>

                    <div class="form-group">
                        <label for="quizInstructions">Instructions & Guidelines</label>
                        <textarea id="quizInstructions" class="form-control" rows="3" placeholder="Quiz rules, scoring system..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="timeLimitMinutes">Time Limit (Minutes)</label>
                        <input type="number" id="timeLimitMinutes" class="form-control" value="30" min="5" required>
                    </div>

                    <div style="margin-top: 20px;">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Publish Quiz</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/instructor.js"></script>
</body>
</html>
